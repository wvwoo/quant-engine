name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.17" }
      - run: uv sync --locked -p 3.14
      - run: ./ci.sh
      - name: SBOM
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > req.txt
          uv run --locked pip-audit --requirement req.txt --format cyclonedx-json --output sbom.cdx.json
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
