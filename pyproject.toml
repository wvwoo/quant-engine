[project]
name = "qts-core"
version = "0.1.0"
description = "0DTE options checklist engine: signals, risk, paper trading. Real trading is owner-gated OFF."
requires-python = ">=3.14"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "yfinance==1.4.1",
    "exchange_calendars==4.13.2",
    "fastapi==0.139.2",
    "uvicorn==0.53.0",
]

[project.scripts]
# `qts` after `pip install -e .`. The repo ALSO ships an executable ./qts shim
# that works with nothing installed, because a fresh clone has no console
# scripts and the CLI must not depend on a packaging step having happened.
qts = "qts_core.cli:main"

[build-system]
# There was no build-system at all: the project ran purely from the repo root
# via pytest's pythonpath and `python -m`. A console script needs one.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# EXPLICIT package list. Auto-discovery on this flat layout would trip over
# tests/, dashboard/, archive/ and qts_v8/ and refuse to build.
packages = ["qts_core", "qts_core.providers", "qts_core.signals"]

[tool.pytest.ini_options]
# --disable-socket bans the wire; --allow-unix-socket re-permits AF_UNIX only.
# FastAPI's TestClient runs the app in-process and asyncio's event loop needs a
# socketpair() for its self-pipe. Blocking that blocked the API tests entirely
# while protecting nothing: the gate that matters is "no call reaches Yahoo",
# and AF_INET stays banned.
addopts = "-q -p no:cacheprovider --disable-socket --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::FutureWarning",
    "error::DeprecationWarning",
    # exchange_calendars uses pandas internals that may warn on 3.x; keep third-party
    # import-time noise from masking our own violations without silencing our code.
    "default::DeprecationWarning:exchange_calendars.*",
    "default::FutureWarning:exchange_calendars.*",
    "default::DeprecationWarning:pandas.*",
    "default::FutureWarning:pandas.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "DTZ"]
# DTZ: flake8-datetimez — bans naive datetime.now()/today(); this codebase runs on a
# machine 7-8h off exchange time, so naive datetimes are a correctness bug, not style.
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# The legacy scanner predates this toolchain; it is kept as a baseline artifact.
"qts_v8/scanner.py" = ["ALL"]
"nvidia_backend.py" = ["ALL"]

[tool.mypy]
files = ["qts_core", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-socket==0.8.0",
    "time-machine==3.2.0",
    "mypy==2.3.0",
    "ruff==0.15.22",
    "pip_audit==2.10.1",
    "coverage==7.15.2",
    "httpx==0.28.1",
]

[tool.uv]
